<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07111f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>UFN GM System</title>
  <meta name="ufn-build" content="recaps-v3">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/ufn-gm-mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <button id="backButton" class="icon-button hidden" aria-label="Back">←</button>
      <div class="brand-lockup">
        <div class="brand-mark">UFN</div>
        <div>
          <div class="eyebrow">RESTRICTED OPERATIONS</div>
          <div id="screenTitle" class="screen-title">GM Mission System</div>
        </div>
      </div>
      <button id="homeButton" class="icon-button hidden" aria-label="Mission list">⌂</button>
    </header>

    <main id="app" class="main"></main>

    <nav id="missionNav" class="bottom-nav hidden" aria-label="Mission navigation">
      <button data-jump="recap">Recap</button>
      <button data-jump="mechanisms">Mechs</button>
      <button data-jump="database" class="primary">Database</button>
    </nav>
  </div>

  <template id="mission-card-template">
    <button class="mission-card">
      <div class="mission-card-art-wrap">
        <img class="mission-card-art" alt="">
        <div class="mission-card-index"></div>
      </div>
      <div class="mission-card-copy">
        <div class="mission-card-name"></div>
        <div class="mission-card-strap"></div>
      </div>
      <div class="mission-card-chevron">›</div>
    </button>
  </template>

  <script type="module" src="app.js"></script>
</body>
</html>
